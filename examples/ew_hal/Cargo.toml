[package]
name = "ew_hal"
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2024"
publish = false

# Cargo.toml

[dependencies]
imxrt-hal = { version = "0.6", features = ["imxrt1010"] }

# As before...
imxrt-ral = { version = "0.6", features = ["imxrt1011", "rt"] }
imxrt-rt = { version = "0.1", features = ["device"] }
imxrt1010evk-fcb = "0.2"
panic-halt = "1"

[build-dependencies]
imxrt-rt = { version = "0.1", features = ["device"] }

[[bin]]
name = "ew_hal"
path = "main.rs"
